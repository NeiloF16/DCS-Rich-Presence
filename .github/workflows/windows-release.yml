name: Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - '**.py'
      - '**.pyw'
      - 'NeiloRichPresence.lua'
      - 'installer/**'
      - '.github/workflows/windows-release.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Install Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install dependencies
        shell: pwsh
        run: python -m pip install -r requirements-build.txt
      - name: Unit tests
        shell: pwsh
        run: python -m unittest discover -v
      - name: Package app with PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir `
            --name DCSRichPresence --icon assets/app.ico `
            --add-data 'NeiloRichPresence.lua;.' `
            --add-data 'assets/app.ico;assets' `
            app.pyw
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC missing at $iscc" }
          & $iscc 'installer\DCSRichPresence.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Installer SHA256
        shell: pwsh
        run: |
          Get-FileHash release\*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $([System.IO.Path]::GetFileName($_.Path))" } | Set-Content -Encoding ascii release\SHA256SUMS.txt
      - name: Upload compiled installer
        uses: actions/upload-artifact@v4
        with:
          name: DCS-Rich-Presence-Windows-Installer
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" release/*.exe release/SHA256SUMS.txt `
            --title "DCS World Rich Presence ${{ github.ref_name }}" `
            --notes-file RELEASE_NOTES.md `
            --verify-tag
